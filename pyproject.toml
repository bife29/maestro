[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "maestro-toolkit"
version = "0.1.0.dev0"
description = "AI-native engineering management toolkit — MCP · RAG · agents · DORA"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Michel Bueno" }]
requires-python = ">=3.12"
keywords = ["mcp", "rag", "ai-agents", "dora-metrics", "clean-architecture", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "matplotlib>=3.9",
  "faker>=25.0",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "import-linter>=2.0",
  "pre-commit>=3.7",
  "pip-audit>=2.7",
  "types-PyYAML",
]
docs = ["mkdocs-material>=9.5", "mkdocs-mermaid2-plugin>=1.1"]
aws = ["boto3>=1.34"]
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
maestro = "maestro.presentation.cli.app:main"

[project.urls]
Homepage = "https://github.com/bife29/maestro"
Documentation = "https://bife29.github.io/maestro/"
Issues = "https://github.com/bife29/maestro/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/maestro"]

# ── Qualidade ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR"]

[tool.mypy]
python_version = "3.12"
packages = ["maestro"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "maestro.domain.*"
strict = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "faker.*", "mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=maestro --cov-report=term-missing --cov-report=xml"
markers = ["security: prompt-injection and hardening suites", "e2e: end-to-end CLI flows"]

[tool.coverage.run]
source = ["src/maestro"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ── Arquitetura (import-linter) — P3 ───────────────────────────────────────
[tool.importlinter]
root_package = "maestro"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
  "maestro.presentation",
  "maestro.application",
  "maestro.domain",
]

[[tool.importlinter.contracts]]
name = "Infrastructure depends only on domain"
type = "forbidden"
source_modules = ["maestro.infrastructure"]
forbidden_modules = ["maestro.presentation", "maestro.application"]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["maestro.domain"]
forbidden_modules = [
  "maestro.infrastructure", "maestro.application", "maestro.presentation",
  "typer", "rich", "matplotlib", "sqlite3", "requests", "httpx", "mcp", "faker", "structlog",
]
